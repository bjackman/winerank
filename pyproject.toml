[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "get-transcripts"
version = "0.1.0"
description = "Fetch YouTube channel video transcripts"
dependencies = [
    "yt-dlp",
    "youtube-transcript-api"
]

[project.scripts]
get-transcripts = "get_transcripts:main"

[tool.setuptools]
py-modules = ["get_transcripts"]
